services:
  - type: web
    name: guru-diamonds
    env: node
    plan: starter
    buildCommand: npm ci && npm run db:generate && npm run build:prod
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: VITE_API_URL
        sync: false
