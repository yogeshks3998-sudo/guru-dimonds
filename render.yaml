services:
  - type: web
    name: guru-diamonds
    env: node
    plan: starter
    buildCommand: npm ci && npm run db:generate && npm run db:deploy && npm run build:api
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: VITE_API_URL
        sync: false
